  if (!$('#tplBody')) return;
  const usable = list.filter(t => t.supported);
  if (!usable.length) {
    $('#tplBody').innerHTML = `<div class="notice" style="margin:0">${icon('alert')}<span>No approved templates yet. Create one in Meta Business Suite > WhatsApp Manager > Message templates, wait for approval (usually a few minutes), then try again.</span></div>`;
    return;
  }
  const pick = broadcast ? (usable.find(t => t.category === 'MARKETING') || usable[0]) : (usable.find(t => t.name === opts.template) || usable.find(t => t.category === 'UTILITY') || usable[0]);
  let cur = pick, vals = [];
  const chatName = opts.phone ? waName(w.chats.find(c => c.wa_id === opts.phone) || { wa_id: opts.phone }) : '';
  $('#tplBody').innerHTML = `<div class="pf">
    <div>
      ${broadcast ? fld('title', 'Broadcast name (only you see this)', `<input class="inp" name="title" maxlength="120" placeholder="e.g. Diwali offer 2026">`)
        : fld('phone', 'WhatsApp number', `<input class="inp" name="phone" maxlength="20" inputmode="tel" value="${esc(opts.phone ? waPhone(opts.phone) : '')}" ${opts.phone ? 'readonly' : ''} placeholder="+91 98765 43210">`, true, 'Enter a WhatsApp number with at least 10 digits.')}
      <div style="margin-top:14px">${fld('template', 'Template', `<select class="inp" name="template">${usable.map((t, i) => `<option value="${i}" ${t === cur ? 'selected' : ''}>${esc(t.name)} · ${esc(t.language)} · ${esc(t.category.toLowerCase())}</option>`).join('')}</select>`)}</div>
      <div class="tpl-params" id="tplParams" style="margin-top:14px"></div>
      <p class="hint">${broadcast ? `Sends to <b>${w.audience}</b> customer${w.audience === 1 ? '' : 's'}. Use <b>{name}</b> in a value to put each customer's first name.` : (chatName ? `To <b>${esc(chatName)}</b>.` : 'The customer can then reply, and the bot answers as usual.')}</p>
    </div>
    <div class="preview-col"><div class="sec-t">Preview</div><div class="tpl-prev" id="tplPrev"></div></div>
  </div>`;
  const paint = () => {
    const sample = broadcast ? 'Ravi' : ((chatName || 'there').split(' ')[0]);
    let body = esc(cur.body);
    for (let i = 1; i <= cur.params; i++) {
      const v = (vals[i - 1] || '').replace(/\{name\}/g, sample);
      body = body.replace(new RegExp(`\\{\\{\\s*${i}\\s*\\}\\}`, 'g'), v ? `<b>${esc(v)}</b>` : `<span style="color:var(--danger)">{{${i}}}</span>`);
    }
    $('#tplPrev').innerHTML = `<div class="bub in" style="max-width:100%">
      ${cur.header === 'IMAGE' ? `<div class="media" style="height:120px;border-radius:8px;background:var(--line);display:grid;place-items:center;color:var(--muted);margin-bottom:6px">${icon('image')}</div>` : ''}
      ${cur.header === 'TEXT' && cur.header_text ? `<b style="display:block;margin-bottom:4px">${esc(cur.header_text)}</b>` : ''}
      <div class="tx">${body.replace(/\n/g, '<br>')}</div>
      ${cur.footer ? `<div class="muted" style="font-size:11.5px;margin-top:4px">${esc(cur.footer)}</div>` : ''}
      <div class="meta">${waTime(new Date().toISOString())}</div></div>
      ${cur.buttons.length ? `<div class="tpl-btns">${cur.buttons.map(b => `<span>${esc(b.text)}</span>`).join('')}</div>` : ''}`;
  };
  const paramsUI = () => {
    vals = Array.from({ length: cur.params }, (_, i) => vals[i] || '');
    $('#tplParams').innerHTML = (cur.params ? cur.params : 0) === 0 && cur.header !== 'IMAGE' ? '<p class="muted" style="font-size:12.5px">This template has no values to fill in.</p>' :
      Array.from({ length: cur.params }, (_, i) => `<div class="field" data-f="p${i + 1}"><label>Value {{${i + 1}}} <span class="req">*</span></label>
        <div class="inrow"><input class="inp" data-p="${i}" maxlength="300" value="${esc(vals[i])}" placeholder="${i === 0 ? 'e.g. {name}' : ''}"><button type="button" class="btn sm" data-pn="${i}" title="Use the customer's first name">{name}</button></div>
        <div class="msg">Fill this in.</div></div>`).join('') +
      (cur.header === 'IMAGE' ? fld('header_image', 'Header image link (https, JPG or PNG)', `<input class="inp" name="header_image" maxlength="500" placeholder="https://ajtechnologiesltd.com/static/images/offer.jpg">`, true, 'Enter an https:// image link.') : '');
    $$('[data-p]', modal).forEach(inp => inp.oninput = () => { vals[+inp.dataset.p] = inp.value; inp.closest('.field').classList.remove('has-err'); paint(); });
    $$('[data-pn]', modal).forEach(b => b.onclick = () => { const inp = $(`[data-p="${b.dataset.pn}"]`, modal); inp.value = (inp.value + ' {name}').trim(); inp.oninput(); inp.focus(); });
    paint();
  };
  $('[name="template"]', modal).onchange = e => {
    cur = usable[+e.target.value]; vals = []; paramsUI();
    const btn = $('[data-save]', modal); delete btn.dataset.armed; btn.innerHTML = `${icon('send')}${broadcast ? 'Start broadcast' : 'Send'}`;
  };
  paramsUI();
  const save = $('[data-save]', modal); save.disabled = false;
  save.onclick = async () => {
    const f = n => ($(`[name="${n}"]`, modal) || {}).value || '';
    const errs = {};
    if (!broadcast && digits(f('phone')).length < 10) errs.phone = 1;
    vals.forEach((v, i) => { if (!v.trim()) errs['p' + (i + 1)] = 1; });
    if (cur.header === 'IMAGE' && !/^https:\/\/\S+\.\S+$/.test(f('header_image').trim())) errs.header_image = 1;
    $$('#tplBody .field').forEach(el => el.classList.toggle('has-err', !!errs[el.dataset.f]));
    if (Object.keys(errs).length) return toast('Please fill in the highlighted fields', 'err');
    const data = { template: cur.name, language: cur.language, params: vals.map(v => v.trim()), header_image: f('header_image').trim(), body: cur.body };
    if (broadcast) {
      if (!save.dataset.armed) {       // second click confirms (each message is charged by WhatsApp)
        save.dataset.armed = '1';
        save.innerHTML = `${icon('check')}Yes, send to ${w.audience} customer${w.audience === 1 ? '' : 's'}`;
        return toast('Check the preview, then click again to confirm');
      }
      save.disabled = true;
      try {
        const item = await API.waCreateBroadcast({ ...data, title: f('title').trim() });
        w.bc = [item, ...(w.bc || [])]; closeModal(); w.tab = 'broadcasts'; renderWhatsApp();
        toast(`Broadcast started: sending to ${item.total} customer${item.total === 1 ? '' : 's'}`);
      } finally { save.disabled = false; }
      return;
    }
    save.disabled = true;
    try {
      const d = await API.waSendTemplate({ ...data, phone: f('phone') });
      closeModal(); waUpdateRow(d.contact);
      if (currentPage() !== 'whatsapp') location.hash = '#/whatsapp';
      else { if (w.tab !== 'chats') { w.tab = 'chats'; renderWhatsApp(); } }
      if (w.active && w.active.wa_id === d.contact.wa_id) { w.msgs.push(d.message); renderWaMsgs(true); renderWaComposer(); }
      else waOpen(d.contact.wa_id);
      toast('Template sent');
    } finally { if (save.isConnected) save.disabled = false; }
  };
}

function renderSettings() {
  const u = state.user || {};
  $('#content').innerHTML = `<div class="view"><div class="set-grid">
    <div class="card"><div class="card-h"><h3>Your account</h3></div><div class="card-b">
      <div class="kv"><span>Name</span><b>${esc(u.name || '')}</b></div>
      <div class="kv"><span>Login email</span><b>${esc(u.email || '')}</b></div>
      <p class="muted" style="font-size:12.5px;margin:12px 0 14px">To change your name, login email or password, edit <code>ADMIN_NAME</code>, <code>ADMIN_EMAIL</code> and <code>ADMIN_PASSWORD</code> in <code>backend/.env</code>, then restart the server.</p>
      <button class="btn danger" id="setLogout">${icon('logout')}Sign out</button>
    </div></div>

    <div class="card"><div class="card-h"><h3>Database connection</h3><div class="spacer"></div><span class="badge b-soft plain" id="stBadge">Checking…</span></div>
      <div class="card-b" id="stBody"><p class="muted">Checking the connection…</p></div></div>

    <div class="card"><div class="card-h"><h3>WhatsApp bot</h3><div class="spacer"></div><span class="badge b-soft plain" id="waStBadge">Checking…</span></div>
      <div class="card-b" id="waStBody"><p class="muted">Checking…</p></div></div>

    <div class="card"><div class="card-h"><h3>Data & appearance</h3></div><div class="card-b">
      <label class="switch" style="margin-bottom:10px"><div><b>Dark mode</b><small>Remembered on this device</small></div><input type="checkbox" id="setDark" ${document.documentElement.dataset.theme === 'dark' ? 'checked' : ''}><span class="tgl"></span></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="expAll">${icon('download')}Export all enquiries (CSV)</button>
        <button class="btn" id="expProj">${icon('download')}Export projects (JSON)</button>
      </div>
    </div></div>
  </div></div>`;

  $('#setLogout').onclick = signOut;
  $('#setDark').onchange = e => setTheme(e.target.checked ? 'dark' : 'light');
  $('#expAll').onclick = () => exportCSV(state.enquiries);
  $('#expProj').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(sortedProjects(), null, 2)], { type: 'application/json' }));
    a.download = `projects-${new Date().toISOString().slice(0, 10)}.json`; a.click(); toast('Projects exported');
  };

  API.status().then(st => {
    if (currentPage() !== 'settings' || !$('#stBody')) return;
    const s = st.storage;
    $('#stBadge').className = 'badge ' + (s.configured && !state.storageError ? 'b-won' : 'b-contacted');
    $('#stBadge').textContent = s.configured && !state.storageError ? 'Connected' : 'Images not set up';
    $('#stBody').innerHTML = `
      <div class="kv"><span>Database</span><b>${esc(st.database.host)}</b></div>
      <div class="kv"><span>Enquiries table</span><b>contact_enquiries · ${st.counts.enquiries} rows</b></div>
      <div class="kv"><span>Projects table</span><b>showcase_projects · ${st.counts.projects} rows</b></div>
      <div class="kv"><span>Image storage</span><b>${s.configured ? `${esc(s.bucket)}/${esc(s.folder)} · ${state.media.length} files` : 'Not set up'}</b></div>
      ${state.storageError ? `<div class="notice" style="margin:12px 0 0">${icon('alert')}<span>${esc(state.storageError)}</span></div>` : ''}`;
    const wa = st.whatsapp || {}, w = state.wa, ready = wa.configured && !w.errorCode;
    $('#waStBadge').className = 'badge ' + (ready ? 'b-won' : 'b-contacted');
    $('#waStBadge').textContent = w.errorCode === 'no_table' ? 'Tables missing' : (wa.configured ? 'Connected' : 'Replies off');
    $('#waStBody').innerHTML = `
      <div class="kv"><span>Chats</span><b>${w.errorCode === 'no_table' ? 'Run supabase_whatsapp.sql' : w.chats.filter(c => !waIsAdmin(c)).length + ' customers'}</b></div>
      <div class="kv"><span>Replies from the dashboard</span><b>${wa.configured ? 'On' : 'Off: add META_ACCESS_TOKEN + PHONE_NUMBER_ID'}</b></div>
      <div class="kv"><span>Templates list</span><b>${wa.templates ? 'On' : 'Off: add WABA_ID'}</b></div>
      <div class="kv"><span>Review request template</span><b>${esc(wa.review_template || '')}</b></div>
      <div class="kv"><span>Alerts go to</span><b>${esc(waPhone(wa.admin_number || ''))}</b></div>`;
  }).catch(err => {
    if (!$('#stBody')) return;
    $('#stBadge').className = 'badge b-closed'; $('#stBadge').textContent = 'Not connected';
    $('#stBody').innerHTML = `<div class="notice" style="margin:0">${icon('alert')}<span>${esc(err.message)}</span></div>`;
  });
}

/* =====================================================================
   THEME, LOGIN, START
   ===================================================================== */
function setTheme(t) {
  document.documentElement.dataset.theme = t; store.set('theme', t);
  $('#themeBtn').innerHTML = icon(t === 'dark' ? 'sun' : 'moon');
}
setTheme(store.get('theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#themeBtn').onclick = () => { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); if (currentPage() === 'settings') renderSettings(); };
$('#menuBtn').onclick = () => { $('#sidebar').classList.add('open'); syncOverlay(); };
$('#sbClose').onclick = () => { $('#sidebar').classList.remove('open'); syncOverlay(); };

function paintUser() {
  const u = state.user || {};
  $('#userName').textContent = u.name || 'Admin';
  $('#userEmail').textContent = u.email || '';
  $('#userAvatar').textContent = initials(u.name || 'Admin');
}
function showLogin(message = '') {
  closeModal(); closeDrawer();
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  const box = $('#loginErr');
  box.innerHTML = message ? icon('alert') + `<span>${esc(message)}</span>` : '';
  box.classList.toggle('hidden', !message);
  $('#lgPass').value = '';
  setTimeout(() => ($('#lgEmail').value ? $('#lgPass') : $('#lgEmail')).focus(), 50);
}
async function startApp(user) {
  state.user = user;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  paintUser();
  $('#content').innerHTML = '<div class="empty">Loading…</div>';
  try { await loadAll(); route(); waStartPolling(); }
  catch (err) {
    if (err.status === 401) return;
    $('#content').innerHTML = `<div class="card"><div class="empty">${icon('db')}<b>Could not load data</b>${esc(err.message)}<br><br><button class="btn primary" id="retryBtn">${icon('refresh')}Try again</button></div></div>`;
    $('#retryBtn').onclick = () => startApp(user);
  }
}
async function refreshData() {
  const btn = $('#refreshBtn'); btn.disabled = true; btn.querySelector('svg').classList.add('spin');
  try { await loadAll(); rerender(); toast('Data refreshed'); }
  finally { btn.disabled = false; btn.querySelector('svg').classList.remove('spin'); }
}
$('#refreshBtn').onclick = refreshData;

$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const em = $('#lgEmail'), pw = $('#lgPass'), btn = $('#loginForm button[type=submit]');
  const bad = { email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim()), pass: !pw.value };
  em.classList.toggle('err', bad.email); em.parentElement.classList.toggle('has-err', bad.email);
  pw.classList.toggle('err', bad.pass); pw.parentElement.classList.toggle('has-err', bad.pass);
  if (bad.email || bad.pass) return;
  btn.disabled = true;
  try {
    const user = await API.login(em.value.trim(), pw.value);
    pw.value = ''; $('#loginErr').classList.add('hidden');
    startApp(user);
  } catch (err) {
    showLogin(err.message);
  } finally { btn.disabled = false; }
};
async function signOut() {
  const ok = await confirmBox({ title: 'Sign out?', text: 'You will need to sign in again to manage the website.', ok: 'Sign out', danger: false });
  if (!ok) return;
  try { await API.logout(); } catch {}
  location.hash = ''; location.reload();
}
$('#logoutBtn').onclick = signOut;

// On page load: already signed in? go straight in, otherwise show the login screen.
API.me().then(startApp).catch(err => showLogin(err.status === 401 ? '' : err.message));
</script>
